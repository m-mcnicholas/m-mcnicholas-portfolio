name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run logic tests
        run: npm run test:logic

      - name: Check repository and local links
        run: npm run check

      - name: Build site
        run: npm run build

      # Browser (Playwright) tests run in the separate ci.yml workflow, not here.
      # The Three.js desktop-scene specs need a GPU the Pages runner does not
      # have, so gating deployment on them left the live site stuck for weeks.
      # Deployment is gated on the deterministic checks above (logic tests, the
      # repository/link check, and a clean production build).

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
