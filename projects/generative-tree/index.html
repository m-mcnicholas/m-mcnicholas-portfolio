<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A procedurally generated L-system forest rendered in Three.js, regrown from a new random seed on every visit.">
  <title>Procedural L-System Forest — Michael McNicholas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1b19'/%3E%3Cpath d='M7 24V8l9 10 9-10v16' fill='none' stroke='%23f1eee8' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./tree.js"></script>
</head>
<body>
  <a class="back-link" href="../../index.html#extra-projects">← Back to Extra Projects</a>

  <div class="tree-canvas" id="tree-canvas" aria-hidden="true"></div>

  <main>
    <header class="tree-header">
      <p class="tree-eyebrow">School project · Generative art</p>
      <h1>Procedural L-System Forest</h1>
      <p class="tree-caption">
        A grove of trees, each grown from an L-system rewriting grammar and interpreted with 3D turtle graphics.
        Drag to orbit, scroll to zoom.
      </p>
      <div class="tree-controls">
        <button type="button" id="regenerate">Regenerate</button>
        <span class="tree-seed" id="tree-seed" aria-live="polite"></span>
      </div>
      <p class="tree-fallback" id="tree-fallback" hidden>
        This sketch needs a browser with WebGL support to render.
      </p>
    </header>
  </main>
</body>
</html>
